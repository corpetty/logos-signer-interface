name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The module builder's rustc; a pass here can't fail a consumer's build on MSRV.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --all-features
        # A run of zero tests also reports success, so the count must be above zero.
        run: |
          set -o pipefail
          cargo test --locked --all-features 2>&1 | tee /tmp/test.log
          ran=$(grep -oE '^test result: ok\. [0-9]+ passed' /tmp/test.log | awk '{s+=$4} END {print s+0}')
          echo "tests run: $ran"
          [ "$ran" -gt 0 ]

  lint:
    name: clippy and rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
